spring.application.name=doctor-service
server.port=8081

# --- Database (Dockerized MySQL) ---
spring.datasource.url=jdbc:mysql://mysql:3306/doctor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Feign Client ---
medical.record.service.name=MEDICALRECORD-SERVICE

# Inter-Service URLs (Docker)

api-gateway.url=http://api-gateway:8085
medicalrecord-service.url=http://medicalrecord-service:8084
patient-service.url=http://patient-service:8082
therapist-service.url=http://therapist-service:8083


# --- Zipkin Tracing ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# --- Actuator ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true

# --- RabbitMQ (container variant) ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true

spring.security.user.name=ayursutra
spring.security.user.password=1234