spring.application.name=doctor-service
server.port=8081




# --- Database (Dockerized MySQL) ---
spring.datasource.url=jdbc:mysql://mysql:3306/doctor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Eureka Registration ---
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Feign Client ---
medical.record.service.name=MEDICALRECORD-SERVICE

# Inter-Service URLs (Docker)

api-gateway.url=http://api-gateway:8085
config-server.url=http://config-server:8888
doctor-service.url=http://doctor-service:8081
medicalrecord-service.url=http://medicalrecord-service:8084
patient-service.url=http://patient-service:8082
therapist-service.url=http://therapist-service:8083


# --- Zipkin Tracing ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# --- Config Server ---
spring.config.import=optional:configserver:http://config-server:8080
spring.profiles.active=docker

# --- Actuator ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.circuitbreakers.enabled=true

# --- Resilience4j ---
resilience4j.circuitbreaker.instances.medicalRecordBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.medicalRecordBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.medicalRecordBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.medicalRecordBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.medicalRecordBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.medicalRecordBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.medicalRecordBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.medicalRecordBreaker.slidingWindowType=count_based
resilience4j.retry.instances.medicalRecordRetry.max-attempts=3
resilience4j.retry.instances.medicalRecordRetry.wait-duration=2s
resilience4j.ratelimiter.instances.medicalRecordRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.medicalRecordRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.medicalRecordRateLimiter.timeout-duration=0

# --- RabbitMQ (container variant) ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false