spring.application.name=doctor-service
server.port=${PORT:8081}

# --- Database Connection ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# --- Feign client target ---
medical.record.service.name=MEDICALRECORD-SERVICE

# --- Zipkin ---
management.tracing.sampling.probability=1.0


# Inter-Service URLs (Docker)
api-gateway.url=http://localhost:8085
doctor-service.url=http://localhost:8081
medicalrecord-service.url=http://localhost:8084
patient-service.url=http://localhost:8082
therapist-service.url=http://localhost:8083

# ==========================
# Actuator Endpoints (Dev)
# ==========================

# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=*

# Allow access to actuator endpoints from any IP (remove or restrict in prod!)
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Enable CORS for actuator endpoints (so you can call from browser tools)
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Show all health details (not just status)
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always

management.health.circuitbreakers.enabled=true


