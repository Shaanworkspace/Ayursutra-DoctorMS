spring.application.name=doctor-service
server.port=${PORT:8081}

# --- Database Connection ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Eureka registration ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Feign client target ---
medical.record.service.name=MEDICALRECORD-SERVICE

# --- Zipkin ---
management.tracing.sampling.probablity=1.0


# ---Config ---
spring.config.import=optional:configserver:http://localhost:8080
spring.profiles.active=dev



# ==========================
# Actuator Endpoints (Dev)
# ==========================

# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=*

# Allow access to actuator endpoints from any IP (remove or restrict in prod!)
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Enable CORS for actuator endpoints (so you can call from browser tools)
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Show all health details (not just status)
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always

management.health.circuitbreakers.enabled=true

# ==========================
# Resilience4j Circuit Breaker Example
# ==========================
resilience4j.circuitbreaker.instances.medicalRecordBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.medicalRecordBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.medicalRecordBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.medicalRecordBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.medicalRecordBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.medicalRecordBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.medicalRecordBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.medicalRecordBreaker.slidingWindowType=count_based

resilience4j.retry.instances.medicalRecordRetry.max-attempts=3
resilience4j.retry.instances.medicalRecordRetry.wait-duration=2s

resilience4j.ratelimiter.instances.medicalRecordRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.medicalRecordRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.medicalRecordRateLimiter.timeout-duration=0



